<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} — {{ site.title }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
      <a class="navbar-brand" href="{{ '/' | relative_url }}">
        <i class="bi bi-cpu"></i> {{ site.title }}
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav ms-auto align-items-center">
          <li class="nav-item"><a class="nav-link" href="{{ '/' | relative_url }}">{% if page.lang == 'cn' %}首页{% else %}Home{% endif %}</a></li>
          {%- if page.lang == 'cn' -%}
          <li class="nav-item"><a class="nav-link" href="{{ '/' | relative_url }}">English</a></li>
          {%- else -%}
          <li class="nav-item"><a class="nav-link" href="{{ '/cn/' | relative_url }}">中文</a></li>
          {%- endif -%}
          <li class="nav-item"><a class="nav-link" href="https://github.com/xRetia/JMS56x"><i class="bi bi-github"></i> GitHub</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4 py-lg-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        {{ content }}
      </div>
    </div>
  </main>

  <footer class="border-top mt-5 py-4">
    <div class="container text-center">
      <p class="text-muted small mb-0">
        <a href="https://github.com/xRetia/JMS56x">{{ site.title }}</a> ·
        firmware analysis &amp; tools ·
        <a href="https://github.com/xRetia/JMS56x/blob/main/README.md">README</a>
      </p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <script>hljs.highlightAll();</script>
</body>
</html>
