<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} — {{ site.title }}</title>
  <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="wrapper">
      <a class="site-title" href="{{ "/" | relative_url }}">{{ site.title }}</a>
      <nav class="site-nav">
        <a href="{{ "/" | relative_url }}">Home</a>
        {% if page.lang == "cn" or page.url contains "cn" %}
          <a href="{{ page.url | replace_first: '_cn', '_en' | replace_first: '/cn/', '/en/' | replace: '.cn.html', '.html' | default: '/' }}">English</a>
        {% else %}
          {% assign cn_url = page.url | replace_first: '_en', '_cn' | replace_first: '/en/', '/cn/' | replace: '.html', '.cn.html' %}
          <a href="{{ cn_url | default: '/index.cn.html' }}">中文</a>
        {% endif %}
      </nav>
    </div>
  </header>
  <main class="page-content">
    <div class="wrapper">
      {{ content }}
    </div>
  </main>
  <footer class="site-footer">
    <div class="wrapper">
      <p>{{ site.title }} — <a href="https://github.com/xRetia/JMS56x">GitHub</a></p>
    </div>
  </footer>
</body>
</html>
